name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A push to a PR branch supersedes the run for its previous commit; without
# this the 5-version matrix queues behind itself on every push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    # A hung test or a pip stall would otherwise occupy a runner for 6 hours.
    timeout-minutes: 15
    permissions:
      contents: read
      # Lets upload-sarif publish findings onto the PR diff.
      security-events: write
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: |
          ruff check src/ tests/
      - name: Type check with mypy
        run: |
          mypy
      - name: Run pcdlint
        run: |
          pcdlint check src/ tests/ --fail-on-warn
      - name: Run tests
        run: |
          pytest --cov=pcdlint --cov-fail-under=91 --cov-report=term-missing
      # One upload only: five identical reports would collide, and Code
      # Scanning needs security-events: write. Emitting must never fail
      # silently -- that would leave a stale report -- but uploading is
      # allowed to, because it legitimately fails in repos without Code
      # Scanning enabled (documented in the README).
      - name: Emit SARIF
        if: matrix.python-version == '3.12'
        run: |
          pcdlint check src/ tests/ --format sarif > pcdlint.sarif
          python -c "import json; d = json.load(open('pcdlint.sarif')); \
            assert d['runs'] and d['runs'][0]['results'] is not None, 'empty SARIF'"
      - name: Upload SARIF to GitHub Code Scanning
        if: matrix.python-version == '3.12'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: pcdlint.sarif

  # The lint job runs from an editable install against the checkout, so a
  # broken pyproject (bad license form, missing package, wrong entry point)
  # would only surface when someone tries to publish. This builds the real
  # artifacts and installs the wheel into a clean interpreter.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install the wheel into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
      - name: Smoke-test the installed console scripts
        run: |
          "$RUNNER_TEMP/clean/bin/pcdlint" --version
          "$RUNNER_TEMP/clean/bin/pclint" --version
          "$RUNNER_TEMP/clean/bin/pcdlint" check examples/demo_good.py
          "$RUNNER_TEMP/clean/bin/python" -c "import pclint; print(pclint.__version__)"

  # One stable check name for branch protection to require. The matrix jobs
  # are called "lint (3.10)" ... "lint (3.14)", so requiring them directly
  # breaks the protection rule the next time a Python version is added or
  # dropped. if: always() is deliberate: without it a failed parent leaves
  # this job "skipped", and GitHub counts a skipped required check as passing.
  gate:
    if: always()
    needs: [lint, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        run: |
          echo "lint=${{ needs.lint.result }} package=${{ needs.package.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.package.result }}" = "success"
