version: 2
updates:
  # The workflows pin actions/checkout, setup-python, codeql-action and
  # pypa/gh-action-pypi-publish to a commit SHA; these PRs keep the pins
  # current, which is the only reason pinning costs nothing after the
  # first time.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Covers the runtime deps (rich, tomli) and the dev extra
  # (pytest, pytest-cov, ruff, mypy).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
