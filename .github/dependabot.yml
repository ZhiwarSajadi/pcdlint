version: 2
updates:
  # The workflows pin actions/checkout, setup-python, codeql-action and
  # pypa/gh-action-pypi-publish by major tag; these PRs keep them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Covers the runtime deps (rich, tomli) and the dev extra
  # (pytest, pytest-cov, ruff, mypy).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
