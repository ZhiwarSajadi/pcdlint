[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-cache-lint"
version = "0.1.0"
description = "Static Taint Linter for Prompt-Cache Determinism"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "pcdlint Contributors"},
]
keywords = [
    "anthropic",
    "llm",
    "linter",
    "openai",
    "prompt-cache",
    "prompt-caching",
    "static-analysis",
    "taint-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/ZhiwarSajadi/pcdlint"
Repository = "https://github.com/ZhiwarSajadi/pcdlint"
Issues = "https://github.com/ZhiwarSajadi/pcdlint/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
pcdlint = "pcdlint.cli:main"
pclint = "pcdlint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v"]
