[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcdlint"
version = "0.1.0"
description = "Static Taint Linter for Prompt-Cache Determinism"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "pcdlint Contributors"},
]
keywords = [
    "anthropic",
    "llm",
    "linter",
    "openai",
    "prompt-cache",
    "prompt-caching",
    "static-analysis",
    "taint-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "rich>=13.0",
    # tomllib only exists from 3.11; tomli is its backport and what 3.10 uses
    # to read [tool.pcdlint].
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/ZhiwarSajadi/pcdlint"
Repository = "https://github.com/ZhiwarSajadi/pcdlint"
Issues = "https://github.com/ZhiwarSajadi/pcdlint/issues"

[project.optional-dependencies]
dev = [
    "mypy~=2.3.1",
    "pytest>=7.0",
    "pytest-cov>=5.0",
    # Pinned because ruff's curated default rule set is version-dependent;
    # an explicit `select` would need all 413 default codes to reproduce it.
    "ruff~=0.16.9",
    # Always installed so mypy can check the 3.10 tomllib fallback branch.
    "tomli>=2.0",
]

[project.scripts]
pcdlint = "pcdlint.cli:main"
pclint = "pcdlint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
